<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversor de Área</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Conversor de Área</h1>

      <div class="campo">
        <label for="valor">Valor</label>
        <input type="number" id="valor" placeholder="Ex: 10" min="0" />
      </div>

      <div class="campo">
        <label for="unidade">Unidade de origem</label>
        <select id="unidade">
          <option value="m2">Metro quadrado (m²)</option>
          <option value="ha">Hectare (ha)</option>
          <option value="km2">Quilômetro quadrado (km²)</option>
          <option value="alqueire">Alqueire paulista</option>
        </select>
      </div>

      <button id="btn-converter">Converter</button>

      <div id="resultados" class="oculto">
        <h2>Resultados</h2>
        <ul id="lista-resultados"></ul>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
